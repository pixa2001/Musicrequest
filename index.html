<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121b"><title>Song Requests · Taberna Flamenca</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./guest-theme.css"></head><body>
<main class="guest-page"><section class="guest-card"><img class="guest-logo" src="./assets/taberna-round-hq.png" alt="Taberna Flamenca logo"><h1>Hey Dj... play my Song!</h1><div class="flamenca-divider" aria-hidden="true"><span>✦</span></div><p class="subtitle">Tell DJ TomaKetama your favorite song!</p>
<form id="request-form"><label class="sr-only" for="guest">Your Name</label><div class="glow-field"><span class="field-icon" aria-hidden="true">♙</span><input id="guest" name="guest" maxlength="60" autocomplete="name" required placeholder="Your Name"></div>
<label class="sr-only" for="title">Song Title</label><div class="glow-field"><span class="field-icon" aria-hidden="true">♫</span><input id="title" name="title" maxlength="120" required placeholder="Song Title"></div>

<label class="sr-only" for="artist">Artist</label><div class="glow-field"><span class="field-icon" aria-hidden="true">✦</span><input id="artist" name="artist" maxlength="120" required placeholder="Artist"></div>
<fieldset class="category-field"><legend>Music Category <span class="required-label">Required</span></legend><div class="category-options">
<label class="category-choice"><input type="radio" name="category" value="german" required><span><span class="category-emoji">🎉</span><span>KARNEVAL</span></span></label>
<label class="category-choice"><input type="radio" name="category" value="latino" required><span><span class="category-emoji">🇪🇸</span><span>SPANISH/<wbr>LATINO</span></span></label>
<label class="category-choice"><input type="radio" name="category" value="international" required><span><span class="category-emoji">🇬🇧</span><span>ENGLISH/<wbr>OTHER</span></span></label>
</div></fieldset>
<button type="submit" id="submit"><span class="send-icon" aria-hidden="true">➤</span> Send It! Let's Go!</button><p class="feedback" id="feedback" role="status" aria-live="polite"></p></form>
<p class="footnote">Song requests are suggestions. The DJ chooses what to play.</p></section></main>
<script type="module" src="./src/guest.js?v=20261105-party-copy3"></script></body></html>
