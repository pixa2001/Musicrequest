<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121b"><title>Song Requests · Taberna Flamenca</title><link rel="stylesheet" href="./styles.css"></head><body>
<main class="guest-page"><section class="guest-card"><img class="guest-logo" src="./assets/taberna-round.png" alt="Taberna Flamenca logo"><h1>Request a Song</h1><p class="subtitle">What would you love to hear tonight?</p>
<form id="request-form"><label for="guest">Your Name</label><input id="guest" name="guest" maxlength="60" autocomplete="name" required placeholder="Your name">
<label for="title">Song Title</label><input id="title" name="title" maxlength="120" required placeholder="Name of the song">

<label for="artist">Artist</label><input id="artist" name="artist" maxlength="120" required placeholder="Artist or band">
<fieldset class="category-field"><legend>Music Category <span class="required-label">Required</span></legend><div class="category-options">
<label class="category-choice"><input type="radio" name="category" value="german" required><span><span class="category-emoji">🎉</span><span>KARNEVAL</span></span></label>
<label class="category-choice"><input type="radio" name="category" value="latino" required><span><span class="category-emoji">🇪🇸</span><span>SPANISH/<wbr>LATINO</span></span></label>
<label class="category-choice"><input type="radio" name="category" value="international" required><span><span class="category-emoji">🇬🇧</span><span>ENGLISH/<wbr>OTHER</span></span></label>
</div></fieldset>
<button type="submit" id="submit">Send Song Request <span>↗</span></button><p class="feedback" id="feedback" role="status" aria-live="polite"></p></form>
<p class="footnote">Song requests are suggestions. The DJ chooses what to play.</p></section></main>
<script type="module" src="./src/guest.js"></script></body></html>
