<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121b"><title>DJ Dashboard · Taberna Flamenca</title><link rel="stylesheet" href="../styles.css"></head><body>
<main class="dashboard"><header class="dash-header"><div><div class="eyebrow">TABERNA FLAMENCA</div><h1>Song Requests</h1><p class="subtitle">Your private, live DJ request list</p></div><div class="header-actions"><span id="connection" class="status">Not connected</span><button id="logout" class="secondary hidden">Sign out</button></div></header>
<section id="login-panel" class="panel login"><h2>DJ Sign In</h2><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"><button type="submit">Sign In</button><p class="feedback" id="login-feedback" role="status"></p></form></section>
<section id="request-panel" class="hidden"><div class="toolbar"><div><strong id="request-count">0 song requests</strong><p class="meta">Älteste Wünsche zuerst</p></div><div class="toolbar-actions"><label for="evening">DJ-Abend</label><select id="evening"></select><button class="secondary" id="export">Songliste exportieren</button><button class="secondary" id="end-evening">Abend beenden</button><button class="secondary" id="refresh">Refresh</button><label class="checkbox-label"><input type="checkbox" id="show-done"> Show played</label></div></div><div id="requests" class="request-list" aria-live="polite"></div></section>
<footer class="footnote dashboard-foot">Private dashboard · Do not share this URL or your sign-in credentials.</footer></main><script type="module" src="../src/dj.js"></script></body></html>
